# Docker Compose : Elasticsearch + Kibana + API NER + Prometheus
# ===============================================================
# Démarrage : docker compose up -d
# Arrêt     : docker compose down
# Logs      : docker compose logs -f
#
# Elasticsearch : http://localhost:9200
# Kibana        : http://localhost:5601
# API NER       : http://localhost:8000/docs
# Prometheus    : http://localhost:9090

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch_ner
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:8.11.0
    container_name: kibana_ner
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  api:
    build: .
    image: ner-tass-api:local
    container_name: ner_api
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX=tass_ner_v2
    ports:
      - "8000:8000"
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus_ner
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - elastic
    depends_on:
      - api

networks:
  elastic:
    driver: bridge

volumes:
  es_data:
    driver: local
